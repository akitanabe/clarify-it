spec_version = 2

[project]
id = "clarify-it"
version = "0.1.0"

[sources]
files = [
  "shared/skill/clarify-it/SKILL.md",
  "shared/skill/clarify-it/references/philosophy.md",
]
managed_roots = ["shared"]

# canonical artifact surface。vercel-labs/skills が `skills/<name>/SKILL.md` を
# 探索するため output_root を repository root に置く。
[targets.skills]
output_root = "."
managed_roots = ["skills"]

[[targets.skills.rules]]
match = "shared/skill/*/SKILL.md"
path = "skills/{1}/SKILL.md"
profile = "markdown+yaml-frontmatter-v1"
header = "<!-- Generated from shared/. Do not edit directly. -->"

# Why Not: philosophy.md は Human が直接読む reference のため、生成 header を付けない。
[[targets.skills.rules]]
match = "shared/skill/clarify-it/references/philosophy.md"
path = "skills/clarify-it/references/philosophy.md"
profile = "markdown-v1"
