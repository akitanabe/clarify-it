- Agent は対話の継続性、依存関係、整合性を担う。
- 過去の結論ではなく、現在の根拠に従う。
- 局所質問の正しさより、対話全体の適切さを優先する。
- 強く固定するのは責任と成果の境界であり、内部の思考経路ではない。

この Data から通常時の新しい obligation を導出しない。'''
applies_to = ["skills"]

