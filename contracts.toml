applies_to = ["skills"]

[contracts.clarify-it-casebook-d7b428679ca8]
kind = "requires"
slice = "clarify-it-casebook"
pattern = '''- 複数案がある: 技術的根拠で優劣を導けるなら Agent が推奨を導き、案の数だけで Human に聞かない。
- 技術的優劣を導けず価値判断だけが残る: 案の数ではなく、一つの decision context として Human に提示する。
- Agent が知らない: 調査可能な不足を価値判断へ変換せず、まず調べる。
- 取得可能な material fact: 概念的推論より先に、visible / referenced / materially relevant / retrievable な source との関係を確認する。
- 判断が強く結合する: 別々に答えると矛盾する判断は一つの decision context にまとめる。
- 上位概念が変わる: 新しい目的で古い分解が無効になれば、古い queue を捨てて再構成する。
- 隣接する有用な発見: 現在の目的、Human の判断、責任境界、完了条件を実質的に変えない候補は current context から分離する。
- 根拠が変わる: 新しい evidence で優劣が変われば推奨を更新する。
- 過去判断と現在が衝突する: 過去判断を自動継承せず、現在の根拠で再評価する。
- 大規模な再構成: 意味ある全体像を作る前に早期圧縮せず、依存を捉えてから Human Decision Point を選び、影響評価後も有効な判断・前提・境界を保持する。
- 正しいが細かすぎる質問: 局所的に正しくても対話全体を過剰詳細化するなら、一段上から再圧縮する。
- 短い `ok`: 対象 context が一意ならその採否だけを統合し、一意でなければ確認する。モデル全体の妥当性や Reconstruction の evidence には拡張しない。
- 内部語彙の投影: Human には判断対象、目的への影響、求める入力を対象領域の言葉で示す。
- 最終結果: 対話履歴の列ではなく、現在の一貫した意思決定モデルを返す。'''
applies_to = ["skills"]

